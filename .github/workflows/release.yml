name: Publish to npm

# Fires on a release tag (v*) push. Publishing uses npm Trusted Publishing (OIDC), so no
# long-lived token is needed — the npm-side trusted publisher must be configured with this
# exact workflow path (.github/workflows/release.yml).
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    name: Build, check, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Verifies the plugin loads into the latest published @deepseek-ai/dsh before shipping.
      - name: Check the DeepSeek Harness plugin
        uses: bowenliang123/dsh-plugin-checker@v1

      # No `packageManager` field in package.json, so the version is pinned explicitly.
      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Verify version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package version $VER"
            exit 1
          fi

      # Trusted publishing (OIDC) — no NODE_AUTH_TOKEN required; npm >= 11.5.1 (bundled with
      # node 24) exchanges the Actions OIDC token for a short-lived publish credential and
      # attaches provenance automatically.
      - name: Publish to npm
        run: npm publish
